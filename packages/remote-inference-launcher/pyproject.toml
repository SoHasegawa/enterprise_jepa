[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "remote-inference-launcher"
version = "0.3.0"
description = "Internal launcher for remote inference servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
remote-inference-launcher = "remote_inference_launcher.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_inference_launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live SSH/Slurm tests skipped unless RIL_RUN_INTEGRATION=1",
]
