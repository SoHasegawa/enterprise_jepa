kind: slurm_vllm
verbosity: verbose
ssh_target: slurm-login
model: Qwen/Qwen3.5-27B
served_model_name: Qwen/Qwen3.5-27B
python_bin: ~/.qwen35-vllm-cu129/bin/python   # from bootstrap
partition: batch-8gpu                          # adjust via `sinfo` on Slurm
walltime: "24:00:00"
num_gpus: 2
memory: 384GB
cpus_per_task: 20
remote_port: 18817                             # use distinct ports for multiple endpoints
keep_remote_job: false
setup_cmd: |
  export PATH="$HOME/.qwen35-vllm-cu129/bin:$PATH"
  python -m pip install -q ninja
extra_args:
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
