[project]
name = "ejepa-bench-workbench-purple"
version = "0.1.0"
description = "Purple agent runtime for the WorkBench benchmark"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.5,<0.4.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.11,<3.0",
    "sse-starlette>=2.1,<3.0",
    "starlette>=0.47,<1.0",
    "uvicorn>=0.35,<1.0",
]

# The `mcp_react` executor imports the upstream WorkBench repo's own
# src.evals.agent / src.evals.inference / src.tools.* modules in-process, so
# their runtime dependencies (per the upstream repo's own pyproject.toml)
# must be installed here too. Install with `uv sync --extra mcp_react`.
[project.optional-dependencies]
mcp_react = [
    "openai>=1.0,<2.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "tenacity>=9.1.4",
]

# JEPA world model for the `mcp_react` executor's `wm_react.py` WM wiring
# (WM_STRATEGY=beam_plan|hier_latent_cem, or prompt_injection/imagined with
# WM_EWM_JEPA_CHECKPOINT / --wm-ewm-jepa-checkpoint). Only that path needs a
# local torch model -- ejepa_wm.backends._ewm_jepa is imported lazily -- so
# these heavy deps live in their own extra:
# `uv sync --project assets/WorkBench/purple --extra mcp_react --extra jepa`.
# Versions mirror the same extra in assets/crmarenapro/purple/pyproject.toml
# and assets/EnterpriseOps-Gym/purple/pyproject.toml.
jepa = [
    "torch>=2.8.0",
    "transformers>=4.56.2",
    "accelerate>=1.13.0",
    "sentencepiece>=0.2.1",
    "protobuf>=3.20.2",
]

[tool.uv]
package = false
