[project]
name = "ejepa-bench-enterpriseops-gym-purple"
version = "0.1.0"
description = "Purple agent runtime for the EnterpriseOps-Gym benchmark"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.5,<0.4.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.11,<3.0",
    "sse-starlette>=2.1,<3.0",
    "starlette>=0.47,<1.0",
    "uvicorn>=0.35,<1.0",
]

# Optional extras mirror the upstream EnterpriseOps-Gym package
# (https://github.com/ServiceNow/EnterpriseOps-Gym). The `mcp_react` executor
# imports these modules, so they must be present in this venv (not just in the
# upstream repo's own venv). Install with `uv sync --extra <provider>` to pull
# the matching LLM provider stack.
[project.optional-dependencies]
mcp_react = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]
openai = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
]
anthropic = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.40.0",
    "langchain-aws>=0.1.0",
    "boto3>=1.28.0",
]
google = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "langchain-google-genai>=0.1.0",
    "langchain-google-vertexai>=1.0.0",
    "google-cloud-aiplatform>=1.40.0",
]
deepseek = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "langchain-deepseek>=0.1.0",
]
# JEPA world model for the `mcp_react` executor's `ewm_imagined` backend
# (WM_EWM_JEPA_CHECKPOINT / --wm-ewm-jepa-checkpoint). Only this path needs a
# local torch model — `ejepa_wm.backends._ewm_jepa` (TextLeWorldModel +
# JepaEwmGenerator) is imported lazily, so the default text-LLM WM (over
# vLLM/MCP) does not pull these in. Heavy, GPU-oriented deps, kept in their own
# extra so a plain `mcp_react` run stays lightweight. Compose with a provider
# extra for the agent LLM, e.g. `uv sync --extra anthropic --extra jepa`.
# Versions mirror the upstream EWM repo the JEPA code was ported from.
jepa = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.56.2",
    "accelerate>=1.13.0",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.1",
    # protobuf is only needed for T5Gemma/Gemma slow->fast tokenizer conversion;
    # keep a broad floor so it stays compatible with the `google` extra's
    # google-cloud-aiplatform (which caps protobuf <7) under uv's universal lock.
    "protobuf>=3.20.2",
]
# Convenience one-shot: the OpenAI provider agent stack + the JEPA world model,
# so you don't have to pass `--extra openai --extra jepa` separately. Equivalent
# to installing both. Lists are duplicated (not self-referenced) to match the
# other extras and because this project is not itself packaged (tool.uv.package
# = false), so `name[extra]` self-references would not resolve.
openai_jepa = [
    # --- openai provider agent stack ---
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    # --- JEPA world model ---
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.56.2",
    "accelerate>=1.13.0",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.1",
    "protobuf>=3.20.2",
]

[tool.uv]
package = false
