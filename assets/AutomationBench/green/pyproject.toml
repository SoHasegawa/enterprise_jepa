[project]
name = "ejepa-bench-automationbench-green"
version = "0.1.0"
description = "Green agent runtime for the AutomationBench benchmark"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.5,<0.4.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.11,<3.0",
    "sse-starlette>=2.1,<3.0",
    "starlette>=0.47,<1.0",
    "uvicorn>=0.35,<1.0",
]

# Domain targets load tasks through the upstream repo's own
# `automationbench.domains.get_combined_dataset` and score with its own
# `automationbench.rubric.partial_credit`, so upstream's runtime deps must be
# importable here. The bundled `sample` target needs none of this (it ships its
# own tasks and a fallback assertion evaluator).
# Install with `uv sync --project assets/AutomationBench/green --extra upstream`.
[project.optional-dependencies]
upstream = [
    "datasets>=3.0,<5.0",
    "rapidfuzz>=3.0,<4.0",
]

[tool.uv]
package = false
